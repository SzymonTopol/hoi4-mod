#########
# NASZE #
#########

#Commonwealth

COM_royal_speech: "The Royal Speech"
COM_royal_speech_desc: "People of the Commonwealth are loosing faith in our great state, a rousing speech shall bring their spirits up. Without them we cannot achieve anything."

COM_tour_to_lublin: "Tour to Lublin"
COM_tour_to_lublin_desc: "Lublin is a birthplace of the Commonwealth. In this city over 300 years ago the delegates of Poland and Lithuania agreed to form a state, which flurished and climbed the international ranks. A visit there will remind every citizen our great past, in hopes of rekindling their pride and eagernes to reform the Commonwealth."

COM_commonwealth_tour: "Commonwealth Tour"
COM_commonwealth_tour_desc: "A grand tour across the vast lands of the crown, while long and costly will prove invaluable for our future endevours."

COM_one_step_forward: "One Step Forward"
COM_one_step_forward_desc: "With people reassured, it is time to move towards more urgent matters that dwell the Commonwealth!"

COM_left_crackdown: "Crackdown on the Left"
COM_left_crackdown_desc: "The radical left, which had festered in the ranks of the liberals are growing in power. With their claims of a supposed upcoming revoluntion and the overthrow of the monarchy it's more than expected of us to stomp out this little bug while it's still small."

COM_right_crackdown: "Crackdown on the Right"
COM_right_crackdown_desc: "Nationalist fervor rises amongst the young, their demands become more blatant, as their support expands. Their involvement in the political landscape of this country shall be curtailed."

COM_pommeranian_excercises: "Pommeranian Excercises"
COM_pommeranian_excercises_desc: "The Armed forces of the Commonwealth have to be ready at all times to fight the enemies of the state. In order to achieve that we have to make sure, that they are in their peak physical condition."

COM_grand_sejm_meeting: "Grand Sejm Meeting"
COM_grand_sejm_meeting_desc: "The monarch cannot deal with all the Commonwealth problems by himself, we must ensure the cooperation with the state apparatus, mostly with the legislative body of Sejm, for that a Grand Meeting will be called."

COM_appoint_new_administrators: "Appoint New Administrators"
COM_appoint_new_administrators_desc: "Expanded pool of administrators will help relieve the strain on our bureaucracy."

COM_fight_corruption: "Fight Corruption"
COM_fight_corruption_desc: "Corruption can defeat even the greatest state, we shall not allow it to expand ever more."

COM_rebalancing_the_system: "Rebalancing the System"
COM_rebalancing_the_system_desc: "An overhaul of the system brings with itslef a breath of fresh air, while negating dissadvantages."

#Commonwealth - Military (conservatives)

COM_military_cabinet: "Military Cabinet"
COM_military_cabinet_desc: "The military had stepped in, to bring back the order."

COM_recal_advisors: "Recall Advisors"
COM_recal_advisors_desc: "We will recall our many advisors that were sent to various states all over the world. Their experteise is needed in their homeland."

COM_disband_sejm: "Disband Sejm"
COM_disband_sejm_desc: "Sejm is by far the biggest obstacle to us. All that whining about majority votes or independed reviev councils are designed to burry us with the bureucracy. We will declare the current session of the Sejm void."

COM_postpone_elections: "Postpone Elections"
COM_postpone_elections_desc: "With no Sejm in our way, we will postpone elections to let the situation deescalate, keeping the Sejm disbanded without a clear end date."

COM_declare_martial_law: "Declare Martial Law"
COM_declare_martial_law_desc: "Time is now. Martial Law will give full power to us and our supporters, allowing for the sweeping changes in the Commonwealth without opposition."

#Commonwealth - Sejm (liberals)

COM_expanded_sejm_session: "Expanded Sejm Session"
COM_expanded_sejm_session_desc: "Sejm reigned in their defacto powers. It is time to make good use of them."

COM_emergency_powers: "Emergency Powers"
COM_emergency_powers_desc: "With 60% majority the current Sejm session can award itself extra dictatorial powers to see their needs to fruition."

COM_arrest_oppositon_leaders: "Arrest Opposition Leaders"
COM_arrest_oppositon_leaders_desc: "Opposition is just slowing us down and adjitaning the populus. Few high profile arrests will put them in their place."

COM_demobilise_army: "Demobilise the Army"
COM_demobilise_army_desc: "Army is displaying dangerous signs of insubordination. We will disband most of the unruly units, while we still have enough leverage."

COM_cancel_szlachta_convention: "Cancel Szlachta Convention"
COM_cancel_szlachta_convention_desc: "Szlachta's attempts to elect a new king are a threat to our expanded powers. We can use said powers and declare cancelation of their silly convention. The unchallenged parliamentary rule can finally come to Commonwealth."

#Commonwealth - Regency (monarchists)

COM_regency_council: "Regency Council"
COM_regency_council_desc: "Our quick action allowed us to form a regency council even without a king selected. It is a great victory for our faction."

COM_szlachta_convention: "Szlachta Convention"
COM_szlachta_convention_desc: "Szlachta's Convetion - a great tradition of Commonwealth's nobility. Weeks of important debates, votes, as well as folkloric plays and even better celebrations."

COM_transfer_units: "Transfer Units"
COM_transfer_units_desc: "A decent bunch of officers still have a noble background. With enough persuasion, we can get these units to follow our orders."

COM_new_candidates: "New Candidates"
COM_new_candidates_desc: "A great number of candidates for the throne are available. Creating a sense of excitement around the selection process."

COM_vote_of_no_confidence: "Vote of No Confidence"
COM_vote_of_no_confidence_desc: "The time is right to challenge the Sejm's authority. Their constant nimbling at our ancestrial rights and the monarchy's authority is a threat to the Commonwealth. We will call for a vote of no confidence in the current Sejm session, in aim to dissolve it."

